<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fortune Muse Console</title>
<style>
  :root { --bg:#fbf7ef; --card:#fff; --ink:#2b2118; --muted:#7a6a58; --gold:#c8961e; --red:#b33a2b; --line:#eadfcb; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; background:#2b2118; color:#fbe7b5; flex-wrap:wrap; }
  header b { font-size:16px; } nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button { background:none; border:0; color:#fbe7b5; padding:6px 10px; border-radius:6px; cursor:pointer; }
  nav button.on { background:#4a3a2a; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .kpi .v { font-size:24px; font-weight:700; } .kpi .t { color:var(--muted); font-size:12px; }
  .ok { color:#2f7d4f; } .bad { color:var(--red); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#f4ecdc; font-weight:600; font-size:12px; text-transform:uppercase; color:var(--muted); }
  input, select, button.btn { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button.btn { cursor:pointer; } button.primary { background:var(--gold); color:#fff; border-color:var(--gold); }
  .row { display:flex; gap:8px; align-items:center; margin:0 0 12px; flex-wrap:wrap; }
  #login { max-width:340px; margin:80px auto; } #login input { width:100%; margin-bottom:8px; }
  .lang { display:flex; align-items:center; gap:6px; }
  header .lang select { background:#4a3a2a; color:#fbe7b5; border-color:#6a5640; }
  #login .lang { justify-content:flex-end; margin-bottom:8px; }
  h2 { margin:24px 0 12px; font-size:16px; } .muted { color:var(--muted); }
  .scroll { overflow-x:auto; }
  .ai { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
  .ai label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  .ai input, .ai select { width:100%; }
  .pair { display:flex; gap:8px; } .pair > div { flex:1; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#f4ecdc; font-size:12px; }
  .result { margin-top:8px; font-size:13px; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <div class="lang"><span aria-hidden="true">🌐</span><select class="langPick" onchange="setLang(this.value)" data-i18n-aria="Language"></select></div>
  <h2 data-i18n="Fortune Muse Console">Fortune Muse Console</h2>
  <input id="em" type="email" data-i18n-ph="Admin email" placeholder="Admin email" />
  <input id="pw" type="password" data-i18n-ph="Password" placeholder="Password" />
  <button class="btn primary" onclick="login()" data-i18n="Sign in">Sign in</button>
  <div id="sso" style="margin-top:12px"></div>
  <p id="lerr" class="bad"></p>
</div>
<div id="app" hidden>
  <header><b>💰 <span data-i18n="Fortune Muse Console">Fortune Muse Console</span></b>
    <nav id="nav"></nav>
    <span style="margin-left:auto" class="lang">
      <span aria-hidden="true">🌐</span><select class="langPick" onchange="setLang(this.value)" data-i18n-aria="Language"></select>
      <button class="btn" onclick="logout()" data-i18n="Sign out">Sign out</button>
    </span>
  </header>
  <main id="view"></main>
</div>

// English labels for code values (statuses, providers, types); other English text is the key itself.
const EN = {
  refund_requested: 'refund requested', dev: 'test payment', comp: 'free (super account)', voucher: 'voucher',
  free_reading: 'free reading', avatar_item: 'avatar item', deity_skin: 'spirit skin', do_not_sell: 'do not sell or share',
  'ai.settings': 'model settings', 'ai.key.set': 'key saved', 'ai.key.clear': 'key cleared', intake: 'conversation',
};
const EN_GB = { 'color': 'colour', 'canceled': 'cancelled' };

const TABLE = { 'zh-Hans': new Map(ZH.map((r) => [r[0], r[1]])), 'zh-Hant': new Map(ZH.map((r) => [r[0], r[2]])) };
const isLang = (l) => LANGS.some(([id]) => id === l);
function browserLang() {
  const tag = (navigator.language || '').toLowerCase();
  if (tag.startsWith('zh')) return /hant|-tw|-hk|-mo/.test(tag) ? 'zh-Hant' : 'zh-Hans';
  return tag.startsWith('en-gb') ? 'en-GB' : 'en-US';
}
let lang = (() => { try { const l = localStorage.getItem('fm_admin_lang'); return isLang(l) ? l : browserLang(); } catch { return browserLang(); } })();

function t(text, vars) {
  let out = TABLE[lang]?.get(text) ?? (lang === 'en-GB' ? EN_GB[text] : null) ?? (TABLE[lang] ? null : EN[text]) ?? text;
  if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
  return out;
}

/** Static text in the page carries data-i18n attributes; tab content is re-rendered. */
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('Fortune Muse Console');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.querySelectorAll('.langPick').forEach((el) => {
    el.innerHTML = LANGS.map(([id, label]) => `<option value="${id}" ${id === lang ? 'selected' : ''}>${label}</option>`).join('');
  });
}

/** Changes the language now, remembers it in this browser and, when signed in, on the admin's account. */
function setLang(l, save = true) {
  if (!isLang(l)) return;
  lang = l;
  try { localStorage.setItem('fm_admin_lang', l); } catch {}
  applyLang();
  ssoButtons();
  if (!$('#app').hidden) go(current);
  if (!save) return;
  if (token) api('/me', { method: 'PATCH', body: JSON.stringify({ language: l }) }).catch(() => {});
  // Picked on the sign-in screen: saved to the account once signed in (see boot).
  else try { localStorage.setItem('fm_admin_lang_pending', '1'); } catch {}
}

// --- API and helpers ----------------------------------------------------------
const API = location.origin;
let token = localStorage.getItem('fm_admin') || '';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
// Prices stay in US dollars; only the formatting follows the language.
const money = (c) => new Intl.NumberFormat(lang, { style: 'currency', currency: 'USD' }).format(c / 100);
const when = (d) => d ? new Date(d).toLocaleString(lang) : '';
const day = (d) => new Date(d).toLocaleDateString(lang, { timeZone: 'UTC' });
const choices = (values, selected) => values.map((v) => `<option value="${v}" ${v === selected ? 'selected' : ''}>${esc(t(v))}</option>`).join('');

async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 || res.status === 403) { logout(); throw new Error(t('Not an admin')); }
  if (!res.ok) { alert(body.message || t('Error')); throw new Error(body.message); }
  return body;
}

async function login() {
  const res = await fetch(API + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email: $('#em').value, password: $('#pw').value }) });
  const body = await res.json();
  if (!res.ok) { $('#lerr').textContent = body.message; return; }
  token = body.token; localStorage.setItem('fm_admin', token); boot();
}
// Google / Microsoft / Apple sign-in: the API sends us back here with ?ticket=… (see modules/auth/oauth.ts).
async function ssoButtons() {
  const { providers } = await fetch(API + '/auth/oauth/providers').then((r) => r.json()).catch(() => ({ providers: [] }));
  const back = encodeURIComponent(location.origin + location.pathname);
  const label = { google: 'Google', microsoft: 'Microsoft', apple: 'Apple' };
  $('#sso').innerHTML = providers.map((p) =>
    `<a class="btn" style="display:block;text-align:center;margin-bottom:6px;text-decoration:none" href="/auth/oauth/${p.id}/start?redirect=${back}">${esc(t('Sign in with {name}', { name: label[p.id] }))}</a>`).join('');
}
async function ssoReturn() {
  const q = new URLSearchParams(location.search);
  if (!q.has('ticket') && !q.has('error')) return;
  history.replaceState(null, '', location.pathname);
  if (q.get('error')) { $('#lerr').textContent = t('Sign-in was cancelled or failed.'); return; }
  const res = await fetch(API + '/auth/oauth/exchange', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ticket: q.get('ticket') }) });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { $('#lerr').textContent = body.message || t('Sign-in failed.'); return; }
  if (!body.token) { $('#lerr').textContent = t('No Fortune Muse account for {email} yet. Create it in the app first, then sign in here.', { email: body.email }); return; }
  token = body.token; localStorage.setItem('fm_admin', token);
}
function logout() { token = ''; localStorage.removeItem('fm_admin'); $('#app').hidden = true; $('#login').hidden = false; }

const tabs = { Dashboard: dashboard, Reports: reports, Users: users, Orders: orders, Content: content, 'Draw pool': rewards, 'AI models': aiModels, Privacy: privacy };
let current = 'Dashboard';
function nav() { $('#nav').innerHTML = Object.keys(tabs).map((k) => `<button class="${k===current?'on':''}" onclick="go('${k}')">${esc(t(k))}</button>`).join(''); }
function go(k) { current = k; nav(); tabs[k](); }

async function dashboard() {
  const s = await api('/admin/stats');
  $('#view').innerHTML = `
    <div class="grid">
      <div class="card kpi"><div class="t">${t('Users')}</div><div class="v">${s.totals.users.toLocaleString(lang)}</div></div>
      <div class="card kpi"><div class="t">${t('Revenue')}</div><div class="v">${money(s.totals.revenueCents)}</div></div>
      <div class="card kpi"><div class="t">${t('Paying users')}</div><div class="v">${s.totals.payers.toLocaleString(lang)}</div></div>
      <div class="card kpi"><div class="t">${t('Open reports')}</div><div class="v ${s.totals.openReports?'bad':''}">${s.totals.openReports}</div></div>
    </div>
    <h2>${t('MVP success metrics')}</h2>
    <div class="grid">${s.kpis.map((k) => `<div class="card kpi"><div class="t">${esc(t(k.label))}</div>
      <div class="v ${k.value >= k.target ? 'ok' : 'bad'}">${k.value}%</div><div class="t">${t('target ≥ {n}%', { n: k.target })}</div></div>`).join('')}</div>
    <h2>${t('Last 14 days')}</h2>
    <div class="scroll"><table><tr><th>${t('Day')}</th><th>${t('Signups')}</th><th>${t('Readings')}</th><th>${t('Revenue')}</th></tr>
    ${s.daily.map((d) => `<tr><td>${day(d.day)}</td><td>${d.signups}</td><td>${d.readings}</td><td>${money(d.revenue)}</td></tr>`).join('')}</table></div>`;
}

async function reports(status = 'open') {
  const { reports } = await api('/admin/reports?status=' + status);
  $('#view').innerHTML = `<div class="row"><select onchange="reports(this.value)">${choices(['open','actioned','dismissed'], status)}</select></div>
  <div class="scroll"><table><tr><th>${t('When')}</th><th>${t('Reason')}</th><th>${t('Reported user')}</th><th>${t('Message')}</th><th>${t('By')}</th><th>${t('Action')}</th></tr>
  ${reports.map((r) => `<tr><td>${when(r.created_at)}</td><td>${esc(t(r.reason))}<div class="muted">${esc(r.details)}</div></td>
    <td>${esc(r.target_handle)} <span class="muted">(${esc(t(r.target_status))})</span></td><td>${esc(r.message_snapshot)}</td><td>${esc(r.reporter_handle)}</td>
    <td>${r.status==='open' ? `<button class="btn" onclick="resolve('${r.id}','dismissed','none')">${t('Dismiss')}</button>
      <button class="btn" onclick="resolve('${r.id}','actioned','restrict')">${t('Restrict')}</button>
      <button class="btn" onclick="resolve('${r.id}','actioned','ban')">${t('Ban')}</button>` : esc(r.resolution_note || t(r.status))}</td></tr>`).join('') || `<tr><td colspan=6 class="muted">${t('Nothing here.')}</td></tr>`}</table></div>`;
}
async function resolve(id, status, userAction) {
  const note = prompt(t('Note (optional)')) ?? '';
  await api('/admin/reports/' + id, { method:'PATCH', body: JSON.stringify({ status, userAction, note }) }); reports();
}

async function users(q = '') {
  const { users } = await api('/admin/users?q=' + encodeURIComponent(q));
  $('#view').innerHTML = `<div class="row"><input id="uq" placeholder="${esc(t('Search email or handle'))}" value="${esc(q)}" /><button class="btn" onclick="users($('#uq').value)">${t('Search')}</button></div>
  <div class="scroll"><table><tr><th>${t('Handle')}</th><th>${t('Email')}</th><th>${t('Status')}</th><th>${t('Readings')}</th><th>${t('Reports')}</th><th>${t('Joined')}</th><th></th></tr>
  ${users.map((u) => `<tr><td>${esc(u.handle)}</td><td>${esc(u.email)} ${u.email_verified?'':`<span class="muted">${t('(unverified)')}</span>`}</td>
    <td><select onchange="setStatus('${u.id}', this.value)">${choices(['active','restricted','banned'], u.status)}</select></td>
    <td>${u.readings}</td><td>${u.reports_against}</td><td>${when(u.created_at)}</td>
    <td><button class="btn" onclick="delUser('${u.id}','${esc(u.handle)}')">${t('Delete')}</button></td></tr>`).join('')}</table></div>`;
}
async function setStatus(id, status) { await api('/admin/users/' + id, { method:'PATCH', body: JSON.stringify({ status }) }); }
async function delUser(id, h) { if (confirm(t('Permanently delete {name} and all their data?', { name: h }))) { await api('/admin/users/' + id, { method:'DELETE' }); users(); } }

async function orders(status = '') {
  const { orders } = await api('/admin/orders?status=' + status);
  $('#view').innerHTML = `<div class="row"><select onchange="orders(this.value)"><option value="">${t('all')}</option>${choices(['paid','refund_requested','refunded','pending','canceled'], status)}</select></div>
  <div class="scroll"><table><tr><th>${t('When')}</th><th>${t('User')}</th><th>${t('Amount')}</th><th>${t('Provider')}</th><th>${t('Status')}</th><th>${t('Reason')}</th><th></th></tr>
  ${orders.map((o) => `<tr><td>${when(o.created_at)}</td><td>${esc(o.handle || t('(deleted)'))}</td><td>${money(o.amount)}${o.tax?` ${t('+ {tax} tax', { tax: money(o.tax) })}`:''}</td>
    <td>${esc(t(o.provider))}</td><td>${esc(t(o.status))}</td><td>${esc(o.refund_reason)}</td>
    <td>${['paid','refund_requested'].includes(o.status) && !['voucher','comp'].includes(o.provider) ? `<button class="btn" onclick="refund('${o.id}')">${t('Refund')}</button>` : ''}</td></tr>`).join('')}</table></div>`;
}
async function refund(id) { if (confirm(t('Refund this order?'))) { await api('/admin/orders/' + id + '/refund', { method:'POST', body: JSON.stringify({ reason:'admin' }) }); orders(); } }

const FIELDS = { song:['title','artist'], drink:['name'], food:['name'], action:['text'], outfit:['style','color'], shoes:['style','color'], color:['name'] };
async function content(kind = 'song') {
  const { items } = await api('/admin/content?kind=' + kind);
  $('#view').innerHTML = `<div class="row"><select onchange="content(this.value)">${choices(Object.keys(FIELDS), kind)}</select>
    ${FIELDS[kind].map((f) => `<input id="cf_${f}" placeholder="${esc(t(f))}" ${f==='text'?'style="min-width:420px"':''} />`).join('')}
    <select id="ctopic"><option value="">${t('any topic')}</option><option value="wealth">${t('wealth')}</option><option value="love">${t('love')}</option></select>
    <button class="btn primary" onclick="addContent('${kind}')">${t('Add')}</button></div>
    ${kind==='action' ? `<p class="muted">${t('Lucky actions: one concrete thing doable today, with an exact object, number, place or time. No vague words.')}</p>` : ''}
    ${kind==='drink' ? `<p class="muted">${t('No alcohol — the server rejects it.')}</p>` : ''}
  <div class="scroll"><table><tr><th>${t('Item')}</th><th>${t('Topic')}</th><th>${t('Active')}</th></tr>
  ${items.map((i) => `<tr><td>${esc(Object.values(i.data).join(' — '))}</td><td>${t(i.topic || 'any')}</td>
    <td><input type="checkbox" ${i.active?'checked':''} onchange="api('/admin/content/${i.id}',{method:'PATCH',body:JSON.stringify({active:this.checked})})" /></td></tr>`).join('')}</table></div>`;
}
async function addContent(kind) {
  const data = Object.fromEntries(FIELDS[kind].map((f) => [f, $('#cf_' + f).value.trim()]));
  if (Object.values(data).some((v) => !v)) return alert(t('Fill every field'));
  await api('/admin/content', { method:'POST', body: JSON.stringify({ kind, topic: $('#ctopic').value || null, data }) }); content(kind);
}

async function rewards() {
  const { rewards } = await api('/admin/rewards');
  const total = rewards.filter((r) => r.active).reduce((s, r) => s + r.weight, 0);
  $('#view').innerHTML = `<p class="muted">${t('Odds are published to users on the draw screen. Draws are free and never tied to spending.')}</p>
  <div class="scroll"><table><tr><th>${t('Reward')}</th><th>${t('Type')}</th><th>${t('Weight')}</th><th>${t('Odds')}</th><th>${t('Active')}</th></tr>
  ${rewards.map((r) => `<tr><td>${esc(r.name)}<div class="muted">${esc(r.description)}</div></td><td>${esc(t(r.type))}</td>
    <td><input type="number" min="0" value="${r.weight}" style="width:80px" onchange="api('/admin/rewards/${r.id}',{method:'PATCH',body:JSON.stringify({weight:+this.value})}).then(rewards)" /></td>
    <td>${r.active && total ? (r.weight / total * 100).toLocaleString(lang, { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + '%' : '—'}</td>
    <td><input type="checkbox" ${r.active?'checked':''} onchange="api('/admin/rewards/${r.id}',{method:'PATCH',body:JSON.stringify({active:this.checked})}).then(rewards)" /></td></tr>`).join('')}</table></div>`;
}

// AI models: provider and model per task, API keys, recent changes (modules/ai on the server).
let ai = null;
const TASK_LABEL = { intake: 'Conversation before the reading', reading: 'Reading' };
const providerName = (id) => esc(t(ai.providers[id]?.label ?? id));

async function aiModels() {
  ai = await api('/admin/ai');
  const keyCell = (id) => {
    const k = ai.keys[id], info = ai.providers[id];
    return k.source === 'console' ? t('Saved here ••••{last4}', { last4: esc(k.last4) })
      : k.source === 'env' ? t('From {env} ••••{last4}', { env: esc(k.env), last4: esc(k.last4) })
      : `<span class="${info.keyRequired ? 'bad' : 'muted'}">${t(info.keyRequired ? 'Not set' : 'Optional')}</span>`;
  };
  $('#view').innerHTML = `<p class="muted">${t('Choose which AI writes the conversation before a reading and the reading itself. Changes apply within a few seconds; the offline mock needs no key.')}</p>
  <div class="ai">${Object.keys(ai.tasks).map((task) => {
    const c = ai.tasks[task];
    return `<div class="card">
      <h2 style="margin-top:0">${t(TASK_LABEL[task])}</h2>
      <div class="muted">${t('Now using')}: <span class="pill">${providerName(c.provider)}${c.model ? ' · ' + esc(c.model) : ''}</span></div>
      <label>${t('Provider')}</label>
      <select id="ai_${task}_provider" onchange="aiProviderChanged('${task}')">${Object.keys(ai.providers).map((id) =>
        `<option value="${id}" ${id === c.provider ? 'selected' : ''}>${providerName(id)}</option>`).join('')}</select>
      <label>${t('Model')}</label>
      <input id="ai_${task}_model" list="ai_${task}_models" value="${esc(c.model)}" /><datalist id="ai_${task}_models"></datalist>
      <label>${t('Base URL')}</label><input id="ai_${task}_url" value="${esc(c.baseUrl)}" />
      <div class="pair">
        <div><label>${t('Temperature (optional)')}</label><input id="ai_${task}_temp" type="number" min="0" max="2" step="0.1" value="${c.temperature ?? ''}" /></div>
        <div><label>${t('Max tokens (optional)')}</label><input id="ai_${task}_max" type="number" min="64" step="64" value="${c.maxTokens ?? ''}" /></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="aiListModels('${task}')">${t('List models')}</button>
        <button class="btn" onclick="aiTest('${task}')">${t('Test connection')}</button>
        <button class="btn primary" onclick="aiSave('${task}')">${t('Save')}</button>
      </div>
      <div id="ai_${task}_result" class="result"></div>
    </div>`;
  }).join('')}</div>
  <h2>${t('API keys')}</h2>
  <p class="muted">${t('Keys are encrypted before they are stored and are never shown again; only the last 4 characters are displayed. A key saved here is used instead of the server’s environment variable.')}</p>
  <div class="scroll"><table><tr><th>${t('Provider')}</th><th>${t('Status')}</th><th>${t('New key')}</th><th></th></tr>
  ${Object.keys(ai.keys).map((id) => `<tr><td>${providerName(id)}</td><td>${keyCell(id)}</td>
    <td><input id="key_${id}" type="password" autocomplete="off" style="width:100%" /></td>
    <td style="white-space:nowrap"><button class="btn primary" onclick="aiSaveKey('${id}')">${t('Save')}</button>
      ${ai.keys[id].source === 'console' ? `<button class="btn" onclick="aiClearKey('${id}')">${t('Clear')}</button>` : ''}</td></tr>`).join('')}</table></div>
  <h2>${t('Recent changes')}</h2>
  <div class="scroll"><table><tr><th>${t('When')}</th><th>${t('Admin')}</th><th>${t('Change')}</th></tr>
  ${ai.audit.map((a) => `<tr><td>${when(a.created_at)}</td><td>${esc(a.admin_email ?? '')}</td><td>${esc(t(a.action))}: ${esc(auditText(a))}</td></tr>`).join('')
    || `<tr><td colspan=3 class="muted">${t('Nothing here.')}</td></tr>`}</table></div>`;
  for (const task of Object.keys(ai.tasks)) aiProviderChanged(task, true);
}

function auditText(a) {
  const d = a.details || {};
  if (a.action === 'ai.settings') return `${t(d.task)} → ${t(ai.providers[d.after?.provider]?.label ?? d.after?.provider ?? '')}${d.after?.model ? ' · ' + d.after.model : ''}`;
  return `${t(ai.providers[d.provider]?.label ?? d.provider ?? '')}${d.last4 ? ' ••••' + d.last4 : ''}`;
}

/** Fills model suggestions and the base URL for the chosen provider; only self-hosted/custom URLs are editable. */
function aiProviderChanged(task, initial = false) {
  const id = $(`#ai_${task}_provider`).value, info = ai.providers[id];
  $(`#ai_${task}_models`).innerHTML = info.models.map((m) => `<option value="${esc(m)}"></option>`).join('');
  const url = $(`#ai_${task}_url`);
  if (!initial || !url.value) url.value = info.baseUrl;
  url.disabled = !info.editableUrl;
  if (!initial) $(`#ai_${task}_model`).value = info.models[0] ?? '';
  const off = id === 'mock';
  for (const f of ['model', 'url', 'temp', 'max']) $(`#ai_${task}_${f}`).disabled = off || (f === 'url' && !info.editableUrl);
}

function aiForm(task) {
  const num = (sel) => { const v = $(sel).value.trim(); return v === '' ? null : Number(v); };
  return { provider: $(`#ai_${task}_provider`).value, model: $(`#ai_${task}_model`).value.trim(), baseUrl: $(`#ai_${task}_url`).value.trim(),
    temperature: num(`#ai_${task}_temp`), maxTokens: num(`#ai_${task}_max`) };
}
const typedKey = (provider) => $(`#key_${provider}`)?.value.trim() || undefined;

async function aiPost(path, body) {
  const res = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(body) });
  return res.json().catch(() => ({}));
}

async function aiTest(task) {
  const out = $(`#ai_${task}_result`), settings = aiForm(task);
  out.className = 'result muted'; out.textContent = t('Testing…');
  const r = await aiPost('/admin/ai/test', { settings, apiKey: typedKey(settings.provider) });
  if (r.error && r.ok === undefined) { out.className = 'result bad'; out.textContent = r.message || r.error; return; }
  out.className = 'result ' + (r.ok ? 'ok' : 'bad');
  out.textContent = r.ok ? `${t('Connected in {ms} ms · model {model}', { ms: r.latencyMs, model: r.model })}\n“${r.reply}”`
    : t('Failed after {ms} ms: {error}', { ms: r.latencyMs, error: r.error });
}

async function aiListModels(task) {
  const out = $(`#ai_${task}_result`), settings = aiForm(task);
  out.className = 'result muted'; out.textContent = t('Testing…');
  const r = await aiPost('/admin/ai/models', { settings: { provider: settings.provider, baseUrl: settings.baseUrl }, apiKey: typedKey(settings.provider) });
  const models = r.models ?? [];
  if (models.length) $(`#ai_${task}_models`).innerHTML = models.map((m) => `<option value="${esc(m)}"></option>`).join('');
  out.className = 'result ' + (models.length ? 'ok' : 'bad');
  out.textContent = models.length ? `${t('{n} models found.', { n: models.length })} ${models.slice(0, 12).join(', ')}${models.length > 12 ? '…' : ''}` : (r.error || t('No models found.'));
}

async function aiSave(task) {
  const res = await fetch(API + '/admin/ai/' + task, { method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(aiForm(task)) });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const out = $(`#ai_${task}_result`); out.className = 'result bad'; out.textContent = body.message || t('Error'); return; }
  await aiModels();
  const out = $(`#ai_${task}_result`); out.className = 'result ok'; out.textContent = t('Saved.');
}
async function aiSaveKey(id) {
  const apiKey = typedKey(id);
  if (!apiKey) return;
  await api('/admin/ai/keys/' + id, { method: 'PUT', body: JSON.stringify({ apiKey }) }); aiModels();
}
async function aiClearKey(id) {
  if (!confirm(t('Remove the saved key for {name}?', { name: t(ai.providers[id].label) }))) return;
  await api('/admin/ai/keys/' + id, { method: 'DELETE' }); aiModels();
}

async function privacy() {
  const { requests } = await api('/admin/privacy-requests');
  $('#view').innerHTML = `<p class="muted">${t('US privacy rights requests. Respond within 45 days.')}</p>
  <div class="scroll"><table><tr><th>${t('When')}</th><th>${t('Email')}</th><th>${t('Type')}</th><th>${t('Status')}</th><th></th></tr>
  ${requests.map((r) => `<tr><td>${when(r.created_at)}</td><td>${esc(r.email)}</td><td>${esc(t(r.type))}</td><td>${esc(t(r.status))}</td>
    <td>${r.status==='open' ? `<button class="btn" onclick="api('/admin/privacy-requests/${r.id}',{method:'PATCH'}).then(privacy)">${t('Mark done')}</button>` : ''}</td></tr>`).join('') || `<tr><td colspan=5 class="muted">${t('No requests.')}</td></tr>`}</table></div>`;
}

async function boot() {
  if (!token) return logout();
  try { await api('/admin/stats'); } catch { return; }
  // A language picked on the sign-in screen is saved to the account; otherwise the account's
  // language applies, so the choice follows the admin to other browsers.
  let pending = false;
  try { pending = localStorage.getItem('fm_admin_lang_pending') === '1'; localStorage.removeItem('fm_admin_lang_pending'); } catch {}
  if (pending) await api('/me', { method: 'PATCH', body: JSON.stringify({ language: lang }) }).catch(() => {});
  else {
    const me = await api('/me').catch(() => null);
    if (me && isLang(me.language) && me.language !== lang) setLang(me.language, false);
  }
  $('#login').hidden = true; $('#app').hidden = false; go(current);
}
applyLang();
ssoButtons();
ssoReturn().then(boot);
</script>
</body>
</html>
